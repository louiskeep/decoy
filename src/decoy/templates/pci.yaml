# x-derived-from-disguise: pci@2026-06-12
# pci -- PCI DSS card-data masking.
#
# Covers the cardholder data elements that PCI DSS forbids storing in
# the clear: PAN, cardholder name, expiration date, CVV/CVC. Strategies
# are derived from the engine's PCI disguise
# (decoy_engine/disguises/pci.yaml, version 2026-06-12) -- the canonical
# legal-correspondence artifact -- and a drift-guard test fails if this
# template falls out of step with it.
#
# PAN uses format-preserving encryption with Luhn-valid output: the
# masked number keeps the real PAN's length and digit shape, passes
# checksum validation in downstream systems, and the same source PAN
# always maps to the same masked PAN (deterministic join survival).
# CVV is redacted entirely (must never be retained per PCI DSS req 3.2).

version: 1

global_settings:
  seed: 42

sources:
  transactions:
    type: file
    format: csv
    path: ./transactions.csv

tables:
  - name: transactions
    columns:
      - name: cardholder_name
        strategy: faker
        provider: person_name

      # Primary Account Number -- format-preserving encryption,
      # Luhn-valid output.
      - name: card_number
        strategy: fpe
        namespace: pan_identity
        provider_config:
          charset: digits
          validate_luhn: true

      - name: card_expiry
        strategy: redact

      # CVV / CVC must be wiped, not pseudonymized -- never retain.
      - name: cvv
        strategy: redact

      # ZIP keeps the first 3 digits (coarse geography for fraud
      # analytics without a full address).
      - name: billing_zip
        strategy: truncate
        provider_config:
          length: 3

      - name: email
        strategy: faker
        provider: person_email

      # Transaction id stays linkable across systems: hash is keyed on
      # derive(job_seed, namespace, value), so the same source id always
      # maps to the same token. Works for any id format (uuid, int, ...).
      - name: transaction_id
        strategy: hash
        namespace: transaction_identity

      # Dates more specific than needed for analytics shift by a keyed
      # offset; same source date -> same shifted date.
      - name: transaction_date
        strategy: date_shift
        namespace: transaction_dates
        provider_config:
          min_days: -30
          max_days: 30

targets:
  transactions:
    type: file
    format: csv
    path: ./transactions_masked.csv
