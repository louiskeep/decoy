# pci -- PCI DSS card-data masking.
#
# Covers the cardholder data elements that PCI DSS forbids storing in
# the clear: PAN, cardholder name, expiration date, CVV/CVC. PAN is
# replaced with a synthetic PAN provider to preserve format; CVV is
# redacted entirely (must never be retained per PCI DSS req 3.2).
#
# V2 PipelineConfig shape per decoy-engine `decoy_engine.config._pipeline`.
# Provider names come from the engine's default registry (see
# `decoy_engine.providers.get_default_registry`).
# CLI.3 (2026-06-02) rewrite: replaces V1 `version: '1.0'` +
# `masking_rules:` shape.

version: 1

global_settings:
  seed: 42

sources:
  transactions:
    type: file
    format: csv
    path: ./transactions.csv

tables:
  - name: transactions
    columns:
      - name: cardholder_name
        strategy: faker
        provider: person_name

      # Primary Account Number -- format-preserving synthetic PAN.
      - name: card_number
        strategy: faker
        provider: synthetic_pan

      - name: card_expiry
        strategy: redact

      # CVV / CVC must be wiped, not pseudonymized -- never retain.
      - name: cvv
        strategy: redact

      - name: billing_zip
        strategy: redact

      - name: email
        strategy: faker
        provider: person_email

      # Transaction id stays linkable across systems via the deterministic
      # masking envelope (HKDF-derived).
      - name: transaction_id
        strategy: faker
        provider: uuid
        deterministic: true
        namespace: transaction_identity

targets:
  transactions:
    type: file
    format: csv
    path: ./transactions_masked.csv
