# graph -- graph-mode pipeline.
#
# Use this shape (mode: graph) when your pipeline is a multi-step DAG
# rather than a flat list of column rules: one or more sources, a chain
# of transforms, one or more sinks. Edges define the data flow.
mode: graph

nodes:
  - id: src
    kind: source.file
    config:
      path: 'data/input.csv'

  - id: drop_secrets
    kind: drop_column
    config:
      columns: ['ssn', 'password_hash']

  - id: out
    kind: target.file
    config:
      output_filename: 'data/cleaned.csv'

edges:
  - from: src
    to: drop_secrets
  - from: drop_secrets
    to: out
