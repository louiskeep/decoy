# minimal -- the smallest sensible decoy pipeline.
#
# A single-table mask: takes a CSV in, writes a masked CSV out. Edit the
# source + target paths, then:
#
#   decoy validate config pipeline.yaml && decoy run pipeline.yaml
#
# Run `decoy explain pipeline` for the V2 pipeline shape.
# Provider names come from the engine's default registry (see
# `decoy_engine.providers.get_default_registry`).

version: 2

global_settings:
  seed: 42

sources:
  people:
    type: file
    format: csv
    path: ./input.csv

tables:
  - name: people
    columns:
      - name: first_name
        strategy: faker
        provider: person_first_name
      - name: last_name
        strategy: faker
        provider: person_last_name
      - name: email
        strategy: faker
        provider: person_email
      # ssn redacted (deterministic synthetic_ssn requires cardinality_mode
      # tuning; redact ships as the safe out-of-the-box default and the
      # operator can swap providers per their data).
      - name: ssn
        strategy: redact
      - name: account_status
        strategy: passthrough

targets:
  people:
    type: file
    format: csv
    path: ./output.csv
