# hipaa -- HIPAA Safe Harbor coverage.
#
# Maps the 18 PHI identifiers from 45 CFR 164.514(b)(2) onto sensible
# default transforms. Tune to your data; some columns may not exist
# in your CSV (delete the rule), others may need a different transform.
version: '1.0'

global_settings:
  seed: 42

input:
  type: csv
  path: 'data/patients.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8

output:
  type: csv
  path: 'data/patients_masked.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8

logging:
  level: info
  file: 'decoy_run.log'

masking_rules:
  # Names
  - column: first_name
    type: faker
    faker_type: first_name
  - column: last_name
    type: faker
    faker_type: last_name

  # Geographic subdivisions smaller than a state -- keep first 3 digits of zip.
  - column: street
    type: faker
    faker_type: street_address
  - column: city
    type: faker
    faker_type: city
  - column: zip
    type: redact
    keep_chars: 3

  # Dates more specific than a year (DOB, admission, discharge, death) -- jitter.
  - column: dob
    type: date_shift
    jitter_days: 30
  - column: admission_date
    type: date_shift
    jitter_days: 30
  - column: discharge_date
    type: date_shift
    jitter_days: 30

  # Telephone, fax, email
  - column: phone
    type: faker
    faker_type: phone_number
  - column: fax
    type: faker
    faker_type: phone_number
  - column: email
    type: faker
    faker_type: email

  # SSN, MRN, account numbers, license numbers -- hash for one-way pseudonymity.
  - column: ssn
    type: hash
    algorithm: sha256
  - column: mrn
    type: hash
    algorithm: sha256
  - column: account_number
    type: hash
    algorithm: sha256
  - column: license_number
    type: hash
    algorithm: sha256

  # Vehicle / device IDs
  - column: vehicle_id
    type: hash
    algorithm: sha256
  - column: device_id
    type: hash
    algorithm: sha256

  # URLs and IP addresses
  - column: url
    type: faker
    faker_type: url
  - column: ip_address
    type: faker
    faker_type: ipv4
