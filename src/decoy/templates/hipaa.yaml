# x-derived-from-disguise: hipaa@2026-06-29
# hipaa -- HIPAA Safe Harbor coverage.
#
# Maps the 18 PHI identifier categories from 45 CFR 164.514(b)(2)
# (lettered A-R) onto the 21 columns below; one category can span
# several columns. Strategies are derived from the engine's HIPAA
# Safe-Harbor disguise (decoy_engine/disguises/hipaa.yaml, version
# 2026-06-29) -- the canonical legal-correspondence artifact -- and a
# drift-guard test fails if this template falls out of step with it.
#
# 2026-06-29 re-derivation (#15): the disguise widened the MRN FPE
# charset alphanum -> ALPHANUM (commit 2effc47, a passthrough-leak
# fix). FPE's preserve_separators mode passes through any character
# outside the configured charset unchanged; charset=alphanum (0-9+a-z,
# no uppercase) let uppercase letters in institution-specific MRN
# formats (e.g. "MRN12345A") through in the clear. This template's mrn
# column had drifted onto the stale lowercase charset and inherited the
# same under-masking defect; it is fixed below to match the disguise.
#
# Identifier coverage notes:
#   Q (full-face photographs): covered as photo path/URL COLUMNS only
#     (mask any such column with redact); image file content is out of
#     scope for a structured-data engine.
#   R (any other unique code): covered via the ssn / mrn / account /
#     health_plan_id columns.
#   ip_address: the disguise's canonical rule is faker ipv4; no ipv4
#     provider exists in the default registry, so this template uses
#     redact, which is strictly safer (documented drift-guard exception).
#
# fpe and date_shift are keyed on derive(job_seed, namespace, value):
# the same source value always maps to the same output within a
# namespace, so joins and longitudinal analysis survive the mask.
#
# Tune to your data; some columns may not exist in your CSV (delete the
# entry), others may need a different strategy.

version: 1

global_settings:
  seed: 42

sources:
  patients:
    type: file
    format: csv
    path: ./patients.csv

tables:
  - name: patients
    columns:
      # A: Names
      - name: first_name
        strategy: faker
        provider: person_first_name
      - name: last_name
        strategy: faker
        provider: person_last_name

      # B: Geographic subdivisions smaller than a state. ZIP uses the
      # HIPAA Safe Harbor cascade (45 CFR 164.514(b)(2)(i)(B)): zip5 ->
      # zip3 (skipping HHS-restricted prefixes where population < 20000)
      # -> state -> suppress. k_threshold: 20000 matches the Safe Harbor
      # population floor. SP-11 replaced the prior truncate(3) strategy.
      - name: street
        strategy: faker
        provider: address_street
      - name: city
        strategy: faker
        provider: address_city
      - name: zip
        strategy: geo_generalize
        provider_config:
          type: zip
          cascade: [zip5, zip3, state, suppress]
          k_threshold: 20000

      # C: Dates more specific than a year. A shared namespace keeps the
      # same source date shifting by the same offset across columns, so
      # admission -> discharge intervals stay plausible.
      - name: dob
        strategy: date_shift
        namespace: patient_dates
        provider_config:
          min_days: -30
          max_days: 30
      - name: admission_date
        strategy: date_shift
        namespace: patient_dates
        provider_config:
          min_days: -30
          max_days: 30
      - name: discharge_date
        strategy: date_shift
        namespace: patient_dates
        provider_config:
          min_days: -30
          max_days: 30

      # D/E/F: Telephone, fax, email
      - name: phone
        strategy: faker
        provider: person_phone
      - name: fax
        strategy: faker
        provider: person_phone
      - name: email
        strategy: faker
        provider: person_email

      # G: SSN -- format-preserving encryption keeps the 9-digit shape
      # and deterministic joinability without exposing the real number.
      - name: ssn
        strategy: fpe
        namespace: ssn_identity
        provider_config:
          charset: digits

      # H: Medical record numbers. charset: ALPHANUM (0-9+A-Z+a-z), not
      # alphanum, so uppercase letters in institution-specific MRN
      # formats are permuted rather than passed through in the clear
      # (FPE passthrough-leak fix, matches disguise 2026-06-29).
      - name: mrn
        strategy: fpe
        namespace: mrn_identity
        provider_config:
          charset: ALPHANUM

      # I: Health-plan beneficiary IDs
      - name: health_plan_id
        strategy: redact

      # J: Account numbers
      - name: account_number
        strategy: fpe
        namespace: account_identity
        provider_config:
          charset: ALPHANUM

      # K: Certificate / license numbers
      - name: license_number
        strategy: redact

      # L: Vehicle identifiers (VINs keep their shape under FPE)
      - name: vehicle_id
        strategy: fpe
        namespace: vehicle_identity
        provider_config:
          charset: ALPHANUM

      # M: Device identifiers
      - name: device_id
        strategy: redact

      # N/O: URLs and IP addresses (see header note on ip_address)
      - name: url
        strategy: redact
      - name: ip_address
        strategy: redact

      # P/Q: Biometric identifiers + photo path/URL columns
      - name: biometric_id
        strategy: redact

targets:
  patients:
    type: file
    format: csv
    path: ./patients_masked.csv
