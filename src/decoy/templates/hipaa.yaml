# hipaa -- HIPAA Safe Harbor coverage.
#
# Maps the 18 PHI identifiers from 45 CFR 164.514(b)(2) onto sensible
# default transforms. Tune to your data; some columns may not exist
# in your CSV (delete the entry), others may need a different
# strategy.
#
# V2 PipelineConfig shape per decoy-engine `decoy_engine.config._pipeline`.
# Provider names come from the engine's default registry (see
# `decoy_engine.providers.get_default_registry`).
# CLI.3 (2026-06-02) rewrite: replaces V1 `version: '1.0'` + `input:` +
# `output:` + `masking_rules:` shape.

version: 1

global_settings:
  seed: 42

sources:
  patients:
    type: file
    format: csv
    path: ./patients.csv

tables:
  - name: patients
    columns:
      # Names
      - name: first_name
        strategy: faker
        provider: person_first_name
      - name: last_name
        strategy: faker
        provider: person_last_name

      # Geographic subdivisions smaller than a state.
      - name: street
        strategy: faker
        provider: address_street
      - name: city
        strategy: faker
        provider: address_city
      - name: zip
        strategy: redact

      # Dates more specific than a year.
      - name: dob
        strategy: faker
        provider: person_dob
      - name: admission_date
        strategy: redact
      - name: discharge_date
        strategy: redact

      # Telephone, fax, email
      - name: phone
        strategy: faker
        provider: person_phone
      - name: fax
        strategy: faker
        provider: person_phone
      - name: email
        strategy: faker
        provider: person_email

      # SSN, MRN, account numbers.
      - name: ssn
        strategy: faker
        provider: synthetic_ssn
      - name: mrn
        strategy: faker
        provider: synthetic_mrn
      - name: account_number
        strategy: faker
        provider: synthetic_account_number
      - name: license_number
        strategy: faker
        provider: synthetic_account_number

      # Vehicle / device IDs
      - name: vehicle_id
        strategy: faker
        provider: uuid
      - name: device_id
        strategy: faker
        provider: uuid

      # URLs and IP addresses
      - name: url
        strategy: redact
      - name: ip_address
        strategy: redact

targets:
  patients:
    type: file
    format: csv
    path: ./patients_masked.csv
