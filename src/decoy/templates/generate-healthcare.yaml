# generate-healthcare -- synthetic patients, visits and claims.
#
# Builds three linked tables from scratch, with no input file. Every visit points at a
# patient that exists, and every claim points at a visit that exists. All values are
# generated, so none of it is real patient data.
#
#   decoy run pipeline.yaml
#
# Claims show `lookup` (ICD-10 and HCPCS code sets) and a `distribution` money column.
# Edit `row_count`, the categories and the weights to match the shape you need.

version: 2

global_settings:
  seed: 42

sources: {}

tables:
  - name: patients
    row_count: 1000
    generate_columns:
      - name: patient_id
        type: sequence
        start: 100000
        step: 1
      - name: first_name
        type: faker
        faker_type: first_name
      - name: last_name
        type: faker
        faker_type: last_name
      - name: date_of_birth
        type: faker
        faker_type: date_of_birth
      - name: phone
        type: faker
        faker_type: phone_number
      - name: city
        type: faker
        faker_type: city
      - name: insurance_plan
        type: categorical
        categories: ["Basic", "Standard", "Premium", "Self-pay"]
        weights: [0.3, 0.4, 0.2, 0.1]

  - name: visits
    row_count: 3000
    generate_columns:
      - name: visit_id
        type: sequence
        start: 1
        step: 1
      - name: patient_id
        type: reference
        reference_table: patients
        reference_column: patient_id
      - name: visit_date
        type: faker
        faker_type: date_this_year
      - name: visit_type
        type: categorical
        categories: ["Checkup", "Emergency", "Specialist", "Follow-up", "Lab"]
        weights: [0.35, 0.1, 0.2, 0.25, 0.1]

  - name: claims
    row_count: 3000
    generate_columns:
      - name: claim_id
        type: sequence
        start: 1
        step: 1
      - name: visit_id
        type: reference
        reference_table: visits
        reference_column: visit_id
      - name: amount_billed
        type: distribution
        family: uniform
        low: 50
        high: 5000
        output_type: decimal(2)
      - name: diagnosis_code
        type: lookup
        codeset: icd10
      - name: procedure_code
        type: lookup
        codeset: hcpcs
      - name: claim_status
        type: categorical
        categories: ["Approved", "Pending", "Denied"]
        weights: [0.7, 0.2, 0.1]

targets:
  patients:
    type: file
    format: csv
    path: ./patients.csv
  visits:
    type: file
    format: csv
    path: ./visits.csv
  claims:
    type: file
    format: csv
    path: ./claims.csv
