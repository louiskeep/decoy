# x-derived-from-disguise: gdpr@2026-06-12
# gdpr -- GDPR Article 4(1) personal-data masking.
#
# Aimed at the categories named in Recital 26 / Art 4(1): name, ID,
# location, online identifier, plus the special-category data in
# Art 9 (redact rather than pseudonymize). Strategies are derived from
# the engine's GDPR disguise (decoy_engine/disguises/gdpr.yaml, version
# 2026-06-12) -- the canonical legal-correspondence artifact -- and a
# drift-guard test fails if this template falls out of step with it.
# Tune for your Article 6 lawful basis.
#
# Identifier coverage notes:
#   ip_address: the disguise's canonical rule is faker ipv4; no ipv4
#     provider exists in the default registry, so this template uses
#     redact, which is strictly safer (documented drift-guard exception).
#   device_id: pseudonymised per Art 4(5) via keyed hash -- the same
#     device always maps to the same token, so device-level analytics
#     survive without exposing the identifier.

version: 1

global_settings:
  seed: 42

sources:
  users:
    type: file
    format: csv
    path: ./users.csv

tables:
  - name: users
    columns:
      # Direct identifiers
      - name: full_name
        strategy: faker
        provider: person_name
      - name: email
        strategy: faker
        provider: person_email
      - name: phone
        strategy: faker
        provider: person_phone

      # Online identifiers (see header notes)
      - name: ip_address
        strategy: redact
      - name: user_agent
        strategy: redact
      - name: device_id
        strategy: hash
        namespace: device_identity

      # Location. Postal code keeps the first 3 characters (coarse
      # geography without a household-level identifier).
      - name: country
        strategy: passthrough
      - name: city
        strategy: faker
        provider: address_city
      - name: postal_code
        strategy: truncate
        provider_config:
          length: 3

      # National ID / passport -- redact, do not preserve.
      - name: national_id
        strategy: redact
      - name: passport_number
        strategy: redact

      # Special category (Art 9) -- redact entirely.
      - name: ethnicity
        strategy: redact
      - name: religion
        strategy: redact
      - name: health_condition
        strategy: redact

      # Behavioral / preference -- shuffle to break the link to a single user.
      - name: salary
        strategy: shuffle

targets:
  users:
    type: file
    format: csv
    path: ./users_masked.csv
