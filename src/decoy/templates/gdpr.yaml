# gdpr -- GDPR Article 4(1) personal-data masking.
#
# Aimed at the categories named in Recital 26 / Art 4(1): name, ID,
# location, online identifier, plus the special-category data in
# Art 9 (redact rather than pseudonymize). Tune for your Article 6
# lawful basis.
#
# V2 PipelineConfig shape per decoy-engine `decoy_engine.config._pipeline`.
# Provider names come from the engine's default registry (see
# `decoy_engine.providers.get_default_registry`).
# CLI.3 (2026-06-02) rewrite: replaces V1 `version: '1.0'` +
# `masking_rules:` shape.

version: 1
mode: mask

global_settings:
  seed: 42

sources:
  users:
    type: file
    format: csv
    path: ./users.csv

tables:
  - name: users
    columns:
      # Direct identifiers
      - name: full_name
        strategy: faker
        provider: person_name
      - name: email
        strategy: faker
        provider: person_email
      - name: phone
        strategy: faker
        provider: person_phone

      # Online identifiers
      - name: ip_address
        strategy: redact
      - name: user_agent
        strategy: redact
      - name: device_id
        strategy: faker
        provider: uuid

      # Location
      - name: country
        strategy: passthrough
      - name: city
        strategy: faker
        provider: address_city
      - name: postal_code
        strategy: redact

      # National ID / passport -- redact, do not preserve.
      - name: national_id
        strategy: redact
      - name: passport_number
        strategy: redact

      # Special category (Art 9) -- redact entirely.
      - name: ethnicity
        strategy: redact
      - name: religion
        strategy: redact
      - name: health_condition
        strategy: redact

      # Behavioral / preference -- shuffle to break the link to a single user.
      - name: salary
        strategy: shuffle

targets:
  users:
    type: file
    format: csv
    path: ./users_masked.csv
