# Binds each sentry id to exactly one baseline file under tests/sentry/baselines/.
# scripts/dev/ratchet_check.py compares every baseline with its merge-base copy and fails
# when keys are added. A row may list `approved_growth` entries (exact key plus a dated owner
# decision, `owner YYYY-MM-DD <text>`); only a listed key may be added without failing.
# A new sentry adds its row here in the slice that introduces it.
#
# kind says where the sentry's allowlist comes from:
#   json       the baseline file is the allowlist; the `consumer` file reads it with
#              load_allowlist("<id>") and no other file may (checked by test_baseline_registry)
#   from_scan  the keys are recomputed from the source tree by a scanner module
#   from_file  the keys are read from a committed config file (a reader in _baseline_sources.py)

[[sentry]]
id = "engine-internal-allow"
baseline = "tests/sentry/baselines/engine-internal-allow.json"
kind = "json"
consumer = "tests/sentry/test_engine_internal_boundary.py"

