# customers pipeline -- the PK source for the FK relationships.
#
# customer_id uses `hash` (SHA-256, truncated to 12 hex chars).
# Hash is a pure function: same input always produces the same output, with
# no state, no mapping store, no coordination between pipelines. Every
# pipeline that hashes the same customer_id produces the same hex string,
# so FK joins survive masking automatically -- that's the whole story.
version: '1.0'
global_settings:
  seed: 42
input:
  type: csv
  path: 'decoy_demo_ref/customers.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
output:
  type: csv
  path: 'decoy_demo_ref/customers_masked.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
masking_rules:
  - column: customer_id
    type: hash
    algorithm: sha256
    truncate: 12
  - column: first_name
    type: faker
    faker_type: first_name
  - column: last_name
    type: faker
    faker_type: last_name
  - column: email
    type: faker
    faker_type: email
  - column: ssn
    type: hash
    algorithm: sha256  # full 64-char hash for the canonical PII column
  - column: dob
    type: date_shift
    jitter_days: 30
  - column: zip
    type: redact
    keep_chars: 3
  - column: phone
    type: faker
    faker_type: phone_number
  - column: gender
    type: passthrough
