# orders pipeline -- customer_id uses the SAME hash config as the customers
# pipeline. No shared state needed: hash is deterministic, so the masked
# customer_id in orders matches the masked customer_id in customers row by
# row, joining cleanly.
version: '1.0'
global_settings:
  seed: 42
input:
  type: csv
  path: 'decoy_demo_ref/orders.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
output:
  type: csv
  path: 'decoy_demo_ref/orders_masked.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
masking_rules:
  - column: order_id
    type: hash
    algorithm: sha256
    truncate: 12
  - column: customer_id  # same hash config as customers_pipeline.yaml -> joinable
    type: hash
    algorithm: sha256
    truncate: 12
  - column: amount
    type: passthrough
  - column: order_date
    type: date_shift
    jitter_days: 30
  - column: status
    type: passthrough
