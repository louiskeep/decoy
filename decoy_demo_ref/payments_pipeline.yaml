# payments pipeline -- order_id uses the SAME hash config as the orders
# pipeline. Determinism preserves the order_id join the same way customer_id
# is preserved between customers and orders.
version: '1.0'
global_settings:
  seed: 42
input:
  type: csv
  path: 'decoy_demo_ref/payments.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
output:
  type: csv
  path: 'decoy_demo_ref/payments_masked.csv'
  csv_options:
    delimiter: ','
    encoding: utf-8
masking_rules:
  - column: payment_id
    type: hash
    algorithm: sha256
    truncate: 12
  - column: order_id  # same hash config as orders_pipeline.yaml -> joinable
    type: hash
    algorithm: sha256
    truncate: 12
  - column: amount
    type: passthrough
  - column: method
    type: passthrough
  - column: paid_at
    type: date_shift
    jitter_days: 7
