# mask_example -- broader mask pipeline (more transforms than minimal).
#
# Replace columns of an input CSV with masked values. Edit the source +
# target paths, then:
#
#   decoy validate config examples/mask_example.yaml
#   decoy run examples/mask_example.yaml
#
# Keyed deterministic masking (recommended for portable, re-identification-
# safe output across runs and machines): point `global_settings.mask_secret_ref`
# below at a >=32-byte secret via `env:NAME` or `file:/PATH`, or pass the
# equivalent `--mask-secret env:NAME` flag on the CLI. This is the MASKING key.
# (`--master-key` / `--key-label` are a SEPARATE, generation-only mechanism for
# generate_columns: pipelines; they do not affect masking. See
# `decoy explain keys`.)
#
# V2 PipelineConfig shape per decoy-engine `decoy_engine.config._pipeline`.
# Provider names come from the engine's default registry (see
# `decoy_engine.providers.get_default_registry`).
# OSS.1 commit 2 (2026-06-02) V2 rewrite: replaces V1 `version: '1.0'`
# + `input:` / `output:` / `masking_rules:` shape.

version: 1

global_settings:
  seed: 42
  # Uncomment to key the deterministic masking strategies (hash, fpe, ...)
  # off a real secret instead of the public job_seed. The value is a
  # REFERENCE, never the raw secret:
  # mask_secret_ref: "env:DECOY_MASK_SECRET"   # or "file:/path/to/secret"

sources:
  customers:
    type: file
    format: csv
    path: ./input.csv

tables:
  - name: customers
    columns:
      # Faker columns: realistic-looking replacement values from the
      # engine's default registry.
      - name: first_name
        strategy: faker
        provider: person_first_name
      - name: last_name
        strategy: faker
        provider: person_last_name
      - name: email
        strategy: faker
        provider: person_email
      - name: phone
        strategy: faker
        provider: person_phone

      # Redact: literal replacement text for fields that must be blanked.
      - name: ssn
        strategy: redact

      # Hash: deterministic; same input -> same output. Use when the
      # downstream needs to JOIN on the value but not see it.
      - name: account_number
        strategy: hash

      # Passthrough: leave the column unchanged. Documents intent.
      - name: account_status
        strategy: passthrough

targets:
  customers:
    type: file
    format: csv
    path: ./masked_output.csv
