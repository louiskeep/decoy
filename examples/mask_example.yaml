# Data Masking Tool - Example Configuration File
# This file demonstrates all available configuration options

version: "1.0"

# Global settings control tool behavior
global_settings:
  seed: 42  # Random seed for deterministic masking
  large_file_threshold_gb: 1.0  # Files larger than this will use chunked processing
  chunk_size: 100000  # Number of rows per chunk when processing large files

# Input configuration defines the source data
input:
  type: "csv"  # Options: "csv" or "fixed_width"
  path: "data/input.csv"
  csv_options:
    delimiter: ","
    encoding: "utf-8"
    header: true  # Headers are required
  
  # Fixed-width file input configuration
  # type: "fixed_width"
  # path: "data/input.fixed"
  # definition_path: "data/input_definition.csv"
  # fixed_width_options:
  #   encoding: "utf-8"
  #   definition_delimiter: ","  # Delimiter used in the definition file
  
# Output configuration defines where masked data will be saved
output:
  type: "csv"  # Options: "csv" or "fixed_width"
  path: "data/masked_output.csv"
  csv_options:
    delimiter: ","
    encoding: "utf-8"
    quoting: "minimal"  # Options: "minimal", "all", "nonnumeric", "none"
  
  # Fixed-width file output configuration
  # type: "fixed_width"
  # path: "data/masked_output.fixed"
  # fixed_width_options:
  #   encoding: "utf-8"
  
# Directory to store mapping files (for consistent masking across runs)
mappings:
  store_directory: "mappings/"
  
# Masking rules define what transformations to apply
masking_rules:
  # Faker-based masking: replaces with realistic fake data
  - column: "full_name"
    type: "faker"
    faker_type: "name"  # Available types: name, first_name, last_name, email, address, phone_number, ssn, job, word
  
  - column: "email"
    type: "faker"
    faker_type: "email"
    preserve_domain: true  # Keep original domain names (for emails only)
  
  # Map masking: uses saved mappings for consistent replacement
  - column: "customer_id"
    type: "map"
    map_type: "faker"  # Available types: faker, hash, fixed
    faker_type: "word"  # Required if map_type is "faker"
    seed: 123  # Optional override of global seed
  
  - column: "product_id"
    type: "map"
    map_type: "fixed"
    fixed_prefix: "PRODUCT"  # Produces PRODUCT_1, PRODUCT_2, etc.
  
  # Redaction masking: replaces with fixed text
  - column: "ssn"
    type: "redact"
    redact_with: "XXX-XX-XXXX"  # Text to use for redaction
  
  # Shuffle masking: randomly reorders values within a column
  - column: "salary"
    type: "shuffle"
  
  # Hash masking: replaces with deterministic hash
  - column: "password"
    type: "hash"
    seed: 456  # Optional override of global seed
  
  # Passthrough: leaves values unchanged
  - column: "department"
    type: "passthrough"

# Optional referential integrity configuration
# Ensures related columns are masked consistently
referential_integrity:
  - name: "employee_identity" # Configuraton files must use the same name
    columns:
      - "employees.FIRST_NAME"
      - "employees.LAST_NAME"
      - "employees.SSN"

