# generate_example -- synthetic-data generation pipeline.
#
# Produces a CSV from scratch -- no input file required. Useful for
# building test fixtures, populating dev databases, or seeding a
# downstream system that needs realistic-looking rows without using
# real data.
#
#   decoy validate examples/generate_example.yaml
#   decoy run examples/generate_example.yaml
#
# Tune `row_count` and the generate_columns to shape the output.
#
# V2 PipelineConfig shape per decoy-engine `decoy_engine.config._pipeline`.
# OSS.1 commit 2 (2026-06-02) V2 rewrite: replaces V1 `version: '1.0'`
# + `generator_settings:` + `output:` shape. V2 uses unified
# `global_settings` and `targets`.

version: 1
mode: generate

global_settings:
  seed: 42

sources: {}

tables:
  - name: customers
    row_count: 1000
    generate_columns:
      # Sequence: monotonic integers starting at `start` with step `step`.
      # Useful for primary-key-like ids.
      - name: customer_id
        type: sequence
        start: 10000
        step: 1

      # Faker: realistic-looking strings via the named faker provider.
      - name: first_name
        type: faker
        faker_type: first_name
      - name: last_name
        type: faker
        faker_type: last_name
      - name: email
        type: faker
        faker_type: email
      - name: phone
        type: faker
        faker_type: phone_number
      - name: street_address
        type: faker
        faker_type: street_address
      - name: city
        type: faker
        faker_type: city
      - name: state
        type: faker
        faker_type: state_abbr

      # Categorical: pick from an explicit list, optionally weighted.
      - name: account_tier
        type: categorical
        categories: ["bronze", "silver", "gold", "platinum"]
        weights: [0.50, 0.30, 0.15, 0.05]

targets:
  customers:
    type: file
    format: csv
    path: ./customers.csv
