# Fresh-install release smoke (OSS.1 commit 3).
#
# Builds the `decoy` wheel via hatchling, installs it into a clean
# Python 3.10 + 3.11 + 3.12 virtualenv, and runs the three canonical
# CLI cells against the installed wheel: `decoy --version`,
# `decoy demo --json`, and `decoy run` against the bundled `minimal`
# template + a tmp CSV.
#
# Coverage gap closed: the in-repo `tests/e2e/test_release_smoke.py`
# runs on the dev checkout (editable install, source tree intact);
# this workflow runs on the built wheel inside an isolated venv that
# does not see the source tree. Both are intentionally redundant.
#
# This is the wheel smoke, the weekly regression lane. It does not smoke
# the release artifact: the 1.0.0 release gate (R1) counts only the
# canonical smoke of the signed bundles,
# `packaging_tools/smoke_install.py --from-dist`, recorded in the
# canonical table of docs/release/smoke-log.md (REL-GATE 5.4).
#
# Triggers:
#   - workflow_dispatch: manual button on the Actions page.
#   - push on tag matching v*: runs on every tag as a regression check.
#   - schedule (weekly): catches index drift from transitive
#     dependencies publishing breaking minor versions.
#
# Engine resolution: tag pushes and manual runs install the wheel
# constrained by requirements-dev.lock, which pins the engine commit.
# The weekly run installs the engine from its pinned git tag and lets
# everything else resolve from today's index (see the install steps).
#
# Matrix: Python only. Per-platform coverage belongs to the canonical
# smoke above, so do not add an OS matrix here.
#
# Reference: oss-cli/README.md sections 8 (Tier A row OSS.1) +
# OSS.1 sprint spec section 'Implementation order' commit 3.

name: release-smoke

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  schedule:
    # Weekly Monday 06:00 UTC; cheap (~30s per matrix entry) and
    # catches transitive-dependency drift before a real release.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  fresh-install:
    name: fresh-install (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lock environment
        uses: ./.github/actions/lock-env
        with:
          python: ${{ matrix.python }}

      - name: Install the build frontend (pinned, constrained by the lock)
        run: uv pip install --python "$DECOY_VENV/bin/python" -c requirements-dev.lock "build==1.2.2"

      - name: Build wheel
        run: $DECOY_VENV/bin/python -m build --wheel

      - name: Create clean install venv
        run: uv venv --python "$DECOY_PYTHON" .smoke

      - name: Install the freshly-built decoy wheel (locked)
        # Tag pushes and manual runs: the dev lock supplies the engine commit.
        if: github.event_name != 'schedule'
        run: uv pip install --python .smoke/bin/python -c requirements-dev.lock dist/*.whl

      - name: Install engine and wheel unconstrained (weekly drift canary)
        # The one install that resolves today's index on purpose, so the weekly
        # run sees transitive-dependency drift. Registered in ci/install-policy.toml.
        if: github.event_name == 'schedule'
        run: uv pip install --python .smoke/bin/python "git+https://github.com/decoy-data/decoy-engine@v0.28.2" dist/*.whl

      - name: decoy --version (smoke 1)
        run: .smoke/bin/decoy --version

      - name: decoy demo --json (smoke 2)
        # Demo runs end-to-end against the bundled templates set,
        # produces a JSON status object on stdout, exits 0 on success.
        run: .smoke/bin/decoy demo --json

      - name: decoy list templates --json (smoke 3a)
        # Confirms the bundled templates set is registered + the
        # listing surfaces no V1 graph template. (S3b redesign: the old
        # `templates list` sub-app folded into the unified `list <kind>`.)
        run: .smoke/bin/decoy list templates --json

      - name: decoy run against the bundled minimal template (smoke 3b)
        # The canonical run cell: take a tmp CSV in, write a masked
        # CSV out. Reads the template from `decoy show template
        # minimal` (default mode already prints raw YAML -- there is
        # no `--raw` flag), NOT from the repo's `examples/` (those are
        # repo-only, not wheel-shipped). (S3b redesign: `templates show`
        # folded into the unified `show <kind> <name>` verb.)
        run: |
          set -euo pipefail
          mkdir -p smoke_run
          printf 'first_name,last_name,email,ssn,account_status\nAda,Lovelace,ada@example.com,000-00-0000,active\n' > smoke_run/input.csv
          .smoke/bin/decoy show template minimal > smoke_run/pipeline.yaml
          # Run outputs land in out/<pipeline>/<run id>/, and LATEST names the newest run.
          cd smoke_run
          ../.smoke/bin/decoy run pipeline.yaml
          test -s "out/pipeline/$(cat out/pipeline/LATEST)/output.csv"
