# PR / push CI gate for the decoy CLI.
#
# Two jobs:
#   ruff   -- lint check only (format --check excluded; see pyproject.toml
#             [tool.ruff] comment for rationale -- 45 files would reformat
#             on the first run; land a formatting commit first).
#   pytest -- unit + sentry + e2e suites against an editable install.
#             Engine is not on PyPI yet (OSS.7 lands the publish pipeline),
#             so we install it from the sibling repo's main branch via a
#             git+https VCS spec, mirroring the release-smoke.yml pattern.
#
# Triggers: every push to main AND every pull request targeting main.
# The gate must be green before a PR can merge.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # ruff: lint gate
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff (pinned, matching engine)
        run: pip install "ruff==0.15.14"

      - name: ruff check
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # pytest: unit + sentry + e2e suites
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install engine from sibling repo (pre-publish window)
        # Engine is not on PyPI yet (OSS.7 lands the publish pipeline).
        # Install from main of the sibling repo, mirroring release-smoke.yml.
        # After OSS.7 publishes, swap to: pip install decoy-engine==<pinned>
        run: |
          pip install --upgrade pip
          pip install "git+https://github.com/louiskeep/decoy-engine@main"

      - name: Install CLI in editable mode with dev extras
        # Editable install wires the `decoy` console script so e2e tests
        # that invoke the installed entry point work without a wheel build.
        run: pip install -e ".[dev]"

      - name: pytest unit + sentry
        run: pytest tests/unit tests/sentry --tb=short

      - name: pytest e2e
        run: pytest tests/e2e --tb=short
