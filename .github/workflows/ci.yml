# PR / push CI gate for the decoy CLI.
#
# Three jobs:
#   ruff               -- lint check only (format --check excluded; see
#                         pyproject.toml [tool.ruff] comment for rationale
#                         -- 45 files would reformat on the first run; land
#                         a formatting commit first).
#   pytest             -- unit + sentry + e2e suites in the environment
#                         requirements-dev.lock pins (the lock-env action; the
#                         engine is locked to the commit of its pinned tag), on
#                         Python 3.10, 3.11 and 3.12. The ruff job uses the same
#                         environment, so its pin is the lock's.
#   fresh-install-smoke -- S3 (OSS-launch sprint): builds the wheel via
#                         hatchling and installs it NON-editable into a
#                         clean venv (no source tree on PYTHONPATH), then
#                         runs the same canonical smoke cells as
#                         release-smoke.yml. pytest above always runs
#                         against an editable install from the source
#                         tree, which cannot catch "works from source,
#                         breaks when installed" bugs -- a missing
#                         package-data include, an import that only
#                         resolves relative to the checkout, an
#                         entry-point that isn't actually wired. This job
#                         is that gate, and it runs on every PR/push
#                         instead of only at release-tag time (unlike
#                         release-smoke.yml, which is release/schedule
#                         gated and gets the full 3.10/3.11/3.12 matrix).
#                         Kept as its own job (not folded into pytest) so
#                         it runs in parallel and does not slow the ruff /
#                         pytest fast lanes; single Python version (3.11,
#                         the middle of the pinned range) to keep this
#                         lane itself fast -- the full version matrix on
#                         a built artifact is release-smoke.yml's job.
#   ci-template-lint   -- F43: actionlint (pinned) on the shipped GitHub Actions
#                         template and the vendored GitLab CI JSON schema (via
#                         check-jsonschema, pinned) on the shipped GitLab
#                         template. Static platform-syntax gate only; the
#                         templates are exercised end to end by tests/unit/
#                         test_ci_templates.py. No live GitHub/GitLab run.
#   certified-profile  -- rebuilds the pristine DP runtime profile from
#                         requirements-certified.txt on the exact CPython
#                         patch it was certified on and runs
#                         scripts/cert_smoke.py. The fingerprint covers every
#                         installed distribution, the engine's version string
#                         included, so an engine bump (or any pin edit here)
#                         silently decertifies the CLI profile unless
#                         something re-derives it. This job is that check. It
#                         fails closed: a mismatch or a dropped manifest row is
#                         red CI, never a pass.
#
# Triggers: every push to main, every pull request targeting main, and a
# weekly schedule. The schedule exists for certified-profile: an engine-side or
# index-side change can decertify the CLI profile with no CLI commit to trigger
# a run.
# The gate must be green before a PR can merge.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 07:00 UTC, an hour after release-smoke.yml's weekly run.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # ruff: lint gate
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lock environment (the ruff pin comes from requirements-dev.lock)
        uses: ./.github/actions/lock-env

      - name: ruff check
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # pytest: unit + sentry + e2e suites
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lock environment
        uses: ./.github/actions/lock-env
        with:
          python: ${{ matrix.python }}

      - name: pytest unit + sentry
        run: pytest tests/unit tests/sentry --tb=short

      - name: pytest e2e
        run: pytest tests/e2e --tb=short

  # ---------------------------------------------------------------------------
  # fresh-install-smoke: packaging gate (S3, OSS-launch sprint)
  # ---------------------------------------------------------------------------
  fresh-install-smoke:
    name: fresh-install-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lock environment
        uses: ./.github/actions/lock-env
        with:
          python: '3.11'

      - name: Install the build frontend (pinned, constrained by the lock)
        run: uv pip install --python "$DECOY_VENV/bin/python" -c requirements-dev.lock "build==1.2.2"

      - name: Build wheel
        run: $DECOY_VENV/bin/python -m build --wheel

      - name: Create clean install venv
        # A fresh venv, never activated -- steps call into it by path so
        # the runner's own environment (which has the repo checked out
        # on disk) cannot leak an import path into the smoke.
        run: uv venv --python "$DECOY_PYTHON" .smoke

      - name: Install the freshly-built decoy wheel (non-editable)
        # The dev lock supplies the engine commit, so no engine spec is repeated here.
        run: uv pip install --python .smoke/bin/python -c requirements-dev.lock dist/*.whl

      - name: decoy --version (smoke 1)
        run: .smoke/bin/decoy --version

      - name: decoy demo --json (smoke 2)
        # Demo runs end-to-end against the bundled templates set,
        # produces a JSON status object on stdout, exits 0 on success.
        # This exercises the engine import path from the installed
        # package, not the source tree.
        run: .smoke/bin/decoy demo --json

      - name: decoy list templates --json (smoke 3a)
        # Confirms the bundled templates set is registered + packaged
        # (package-data) in the wheel, and the listing surfaces no V1
        # graph template. (S3b redesign: the old `templates list` sub-app
        # folded into the unified `list <kind>` verb.)
        run: .smoke/bin/decoy list templates --json

      - name: decoy run against the bundled minimal template (smoke 3b)
        # The canonical run cell: take a tmp CSV in, write a masked CSV
        # out. Reads the template from `decoy show template minimal`
        # (default mode already prints raw YAML; there is no `--raw`
        # flag), NOT from the repo's `examples/` (those are repo-only,
        # not wheel-shipped -- the smoke must only touch what the wheel
        # actually ships). (S3b redesign: `templates show` folded into
        # the unified `show <kind> <name>` verb.)
        run: |
          set -euo pipefail
          mkdir -p smoke_run
          printf 'first_name,last_name,email,ssn,account_status\nAda,Lovelace,ada@example.com,000-00-0000,active\n' > smoke_run/input.csv
          .smoke/bin/decoy show template minimal > smoke_run/pipeline.yaml
          cd smoke_run
          ../.smoke/bin/decoy run pipeline.yaml
          test -s output.csv

      - name: decoy ci check against the installed wheel (smoke 4)
        # F43: the CI wrapper from the INSTALLED package, config-only validation
        # of the pipeline smoke 3b produced, SARIF out. Proves the decoy.ci
        # modules ship in the wheel and the schema-valid log is written.
        run: |
          set -euo pipefail
          cd smoke_run
          # The run above left output.csv; validation warns would_overwrite on an existing target.
          rm -f output.csv
          git init -q
          printf 'schema_version: decoy-ci/v1\npipelines:\n  - {id: smoke, path: pipeline.yaml}\nchecks:\n  validation: {mode: config}\n' > .decoy-ci.yaml
          ../.smoke/bin/decoy ci check .decoy-ci.yaml --format sarif --output decoy.sarif
          ../.smoke/bin/python -c "import json; d = json.load(open('decoy.sarif')); assert d['version'] == '2.1.0' and d['runs'][0]['results'] == []"

  # ---------------------------------------------------------------------------
  # ci-template-lint: platform syntax for the shipped CI templates (F43)
  # ---------------------------------------------------------------------------
  ci-template-lint:
    name: ci-template-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install check-jsonschema from the hash-checked lock
        # ci/ci-tools.lock (compiled from ci/ci-tools.in by scripts/dev/lock.sh) pins
        # check-jsonschema and its dependencies with hashes. --only-binary :all: refuses
        # an sdist, which pip would build with unpinned build dependencies.
        run: |
          pip install --require-hashes --only-binary :all: -r ci/ci-tools.lock

      - name: Fetch the pinned actionlint binary (sha256-checked)
        # actionlint-py ships only an sdist, so the release binary is used instead. Its
        # url and sha256 live in ci/install-policy.toml; a mismatch fails this step.
        run: |
          python scripts/dev/fetch_ci_binary.py actionlint --dest "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: actionlint (GitHub Actions template)
        run: actionlint integrations/github-actions/decoy-ci.yml

      - name: GitLab CI schema (GitLab template)
        run: check-jsonschema --builtin-schema vendor.gitlab-ci integrations/gitlab/decoy-ci.yml

  # ---------------------------------------------------------------------------
  # certified-profile: requirements-certified.txt still reproduces a
  # certified DP row
  # ---------------------------------------------------------------------------
  certified-profile:
    name: certified-profile (cpython 3.10.20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lock environment (builds the wheel)
        uses: ./.github/actions/lock-env

      - name: Install the build frontend (pinned, constrained by the lock)
        run: uv pip install --python "$DECOY_VENV/bin/python" -c requirements-dev.lock "build==1.2.2"

      - name: Build wheel
        run: $DECOY_VENV/bin/python -m build --wheel

      - name: Pin the exact CPython patch
        # The certified row is keyed on the full patch (3.10.20.final), not
        # a floating 3.10, matching the engine's dps-dependency-matrix job.
        run: uv python install 3.10.20

      - name: Create the runtime-only venv
        # uv venv seeds no pip/setuptools: every distribution in the venv is
        # part of the hashed set, so the venv must hold exactly the certified
        # profile and nothing else.
        run: uv venv --python 3.10.20 .venv-certified

      - name: Install engine and CLI wheel without dependencies
        # Only the two named artifacts: --no-deps stops the resolver, and the
        # next step installs the complete fingerprinted closure.
        run: uv pip install --python .venv-certified/bin/python --no-deps "git+https://github.com/louiskeep/decoy-engine@v0.19.0" dist/*.whl

      - name: Install the pinned closure
        run: uv pip install --python .venv-certified/bin/python -r requirements-certified.txt

      - name: Certification smoke (fingerprint + manifest row + real DP fit)
        run: .venv-certified/bin/python scripts/cert_smoke.py
