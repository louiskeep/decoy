# Files shared with the engine repository (louiskeep/decoy-engine). A [[vendored]] file is
# byte-identical there: its local sha256 must equal blob_sha256, engine_path must equal local_path,
# and `commit` is an engine commit that holds the same bytes, which tests/sentry/
# test_ci_lock_installs.py fetches and compares. So editing the file and this hash together, in
# this repository only, still fails; changing a vendored file means landing it in the engine first
# and pointing `commit` at that commit. A [[mirror]] is adapted: its header names engine_path and
# the differences, and blob_sha256 records the engine blob it was adapted from. Not caught: a
# deliberate change that lands in both repositories and re-points both ledgers (a reviewed
# change), and mirrors, which are not byte-identical.
#
# After both repositories merge to main, the orchestrator re-points every `commit` below, and the
# engine's ledger, at the merge commits on main. Paths and hashes do not move.

[[vendored]]
engine_path = ".github/actions/setup-uv/action.yml"
local_path = ".github/actions/setup-uv/action.yml"
blob_sha256 = "91b5aa05410a96702c57818a966cf29c45ef1c2b204d929ffc36694b84de86ec"
commit = "f2b7b3da4b9374b8745e089530b3e1c7815ce638"

