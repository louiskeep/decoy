# Files copied from the engine's CI-E1 work. A vendored file is byte-identical: its local sha256
# must equal blob_sha256 and its engine_path must equal its local_path. A mirror is adapted: its
# header names engine_path and the differences, and blob_sha256 records the engine blob it was
# adapted from. `commit` is informational provenance; re-point it to the CI-E1 merge on engine
# main before L1b (the paths and blob hashes do not move). CI-X compares engine main to this file.

