[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "decoy"
version = "0.1.0"
description = "Decoy CLI — data masking and synthetic generation from the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE.md"]
authors = [{ name = "louiskeep" }]
dependencies = [
    "decoy-engine>=0.1.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
decoy = "decoy.__main__:app"
forge = "decoy._deprecated:forge_shim"

[tool.hatch.build.targets.wheel]
packages = ["src/decoy"]

[tool.hatch.build.targets.wheel.force-include]
"src/decoy/templates" = "decoy/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
