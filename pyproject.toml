[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
# OSS.3 (2026-06-02) / Q-OSS-1 RESOLVED 2026-06-01: PyPI distribution
# name is `decoy-cli`; the import package + console script stay `decoy`.
# Rationale: the bare `decoy` PyPI name is not gating the launch window;
# `decoy-cli` is honest about what the dist is (the CLI) and leaves the
# engine name (`decoy-engine`) unaffected.
name = "decoy-cli"
version = "0.1.0"
description = "Source-available CLI for data masking and synthetic generation. Wraps the decoy-engine library; runs masking + generate jobs from the terminal or a notebook."
readme = "README.md"
requires-python = ">=3.10"
# OSS.2 (license flip to Apache-2.0) is DEFERRED INDEFINITELY per PO
# decision 2026-06-02: the CLI + engine are staying private. The
# Apache-2.0 lock from 2026-06-01 still stands as the intended
# end-state IF + WHEN the OSS launch resumes; the timing is
# unscheduled. Until then the CLI carries BUSL-1.1, the commercial
# platform pairs with it, and the LICENSE.md auto-converts to
# Apache-2.0 on its Change Date (see LICENSE.md for the exact date).
# Also: the description = "Free, open-source CLI..." line on the
# project block above will need rewriting alongside any future flip.
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE.md"]
authors = [{ name = "louiskeep" }]

# PyPI Trove classifiers. Bare-minimum honest set: the Python versions
# we actually test against (3.10/3.11/3.12 in release-smoke.yml), the OS
# support tier (cross-platform; CI gates linux today, mac/windows in
# OSS.7), the topic taxonomy that data-engineering operators search for,
# and the maturity marker ("Beta" pre-1.0 per semver). The full
# reference list lives at https://pypi.org/classifiers/.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Search keywords. These show up in `pip search` analogues + the PyPI
# project page's search-indexing. Kept short, kept honest.
keywords = [
    "data-masking",
    "synthetic-data",
    "anonymization",
    "pii",
    "privacy",
    "data-generation",
    "faker",
    "cli",
    "decoy",
]

dependencies = [
    "decoy-engine>=0.1.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

# Project URLs surfaced on the PyPI sidebar. Source key is the
# convention pip/Warehouse uses.
[project.urls]
Homepage = "https://github.com/louiskeep/decoy"
Repository = "https://github.com/louiskeep/decoy"
Documentation = "https://github.com/louiskeep/decoy/blob/main/README.md"
Issues = "https://github.com/louiskeep/decoy/issues"
Changelog = "https://github.com/louiskeep/decoy/blob/main/CHANGELOG.md"
"Release smoke log" = "https://github.com/louiskeep/decoy/blob/main/docs/release/smoke-log.md"

[project.scripts]
# Console script name STAYS `decoy` regardless of the distribution
# name. Same with `forge` (the deprecation shim from S22).
decoy = "decoy.__main__:app"
forge = "decoy._deprecated:forge_shim"

[tool.hatch.build.targets.wheel]
# Import package stays `decoy` (Q-OSS-1 RESOLVED). The `packages` walk
# under src/decoy already pulls in `decoy/templates/`; a `force-include`
# entry was previously layered on top, which caused hatchling to add
# `decoy/templates/__init__.py` twice and `python -m build --wheel`
# to abort with "A second file is being added to the wheel archive".
# OSS.3 follow-up (2026-06-02): drop the force-include line. Confirmed
# via local build: dist/decoy_cli-0.1.0-py3-none-any.whl builds clean
# AND the templates still ship inside the wheel under decoy/templates/.
packages = ["src/decoy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ── Ruff lint + format baseline ─────────────────────────────────────────────
# Mirrors the engine's config (decoy-engine/pyproject.toml [tool.ruff]) but
# with a narrower select: the CLI is a thin Typer wrapper with no data-plane
# logic, so the heavy security (S) and naming (N) rulesets are excluded to
# keep the gate focused and violation-free from day one.
# B008 is suppressed globally because Typer's canonical idiom is to supply
# typer.Option/Argument as argument defaults; raising B008 on every command
# handler would require non-idiomatic workarounds.
# format --check is intentionally NOT in the CI gate (45 files would reformat
# on first run; land a separate formatting commit before enabling it).

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [".pytest_cache", "__pycache__", "logs", "docs/_build"]

[tool.ruff.lint]
# Focused selection: core pyflakes/pycodestyle (E/F), import order (I),
# bugbear (B), and Ruff-native rules (RUF, which catches ambiguous unicode
# including em-dashes per the no-em-dash repo rule).
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    "E501",   # line-too-long: owned by ruff format; not gated here yet
    "B008",   # typer.Option/Argument in defaults: idiomatic Typer pattern
    "B904",   # raise-without-from: cosmetic; high-volume; fix as touched
    "B905",   # zip-without-strict: noise in test assertions
    "RUF012", # mutable-class-default: false positives on dataclass-like defaults
    "RUF013", # implicit-Optional: cleanup as touched; high-volume
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert and have lower naming / style bars.
"tests/**" = ["S101", "S105", "S106", "S108", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
