[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
# OSS.3 (2026-06-02) / Q-OSS-1 RESOLVED 2026-06-01: PyPI distribution
# name is `decoy-cli`; the import package + console script stay `decoy`.
# Rationale: the bare `decoy` PyPI name is not gating the launch window;
# `decoy-cli` is honest about what the dist is (the CLI) and leaves the
# engine name (`decoy-engine`) unaffected.
name = "decoy-cli"
version = "0.1.0"
description = "Source-available CLI for data masking and synthetic generation. Wraps the decoy-engine library; runs masking + generate jobs from the terminal or a notebook."
readme = "README.md"
requires-python = ">=3.10"
# OSS.2 (license flip to Apache-2.0) is DEFERRED INDEFINITELY per PO
# decision 2026-06-02: the CLI + engine are staying private. The
# Apache-2.0 lock from 2026-06-01 still stands as the intended
# end-state IF + WHEN the OSS launch resumes; the timing is
# unscheduled. Until then the CLI carries BUSL-1.1, the commercial
# platform pairs with it, and the LICENSE.md auto-converts to
# Apache-2.0 on its Change Date (see LICENSE.md for the exact date).
# Also: the description = "Free, open-source CLI..." line on the
# project block above will need rewriting alongside any future flip.
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE.md"]
authors = [{ name = "louiskeep" }]

# PyPI Trove classifiers. Bare-minimum honest set: the Python versions
# we actually test against (3.10/3.11/3.12 in release-smoke.yml), the OS
# support tier (cross-platform; CI gates linux today, mac/windows in
# OSS.7), the topic taxonomy that data-engineering operators search for,
# and the maturity marker ("Beta" pre-1.0 per semver). The full
# reference list lives at https://pypi.org/classifiers/.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Search keywords. These show up in `pip search` analogues + the PyPI
# project page's search-indexing. Kept short, kept honest.
keywords = [
    "data-masking",
    "synthetic-data",
    "anonymization",
    "pii",
    "privacy",
    "data-generation",
    "faker",
    "cli",
    "decoy",
]

dependencies = [
    # Floor bumped 0.1.0 -> 0.3.0 -> 0.4.0 for DE-02 (KeyProvider / keyed-mask
    # secrets). `--mask-secret` and `global_settings.mask_secret_ref` require
    # the engine's `decoy_engine.keyprovider` module (the resolver + the typed
    # MaskSecretError gate); a pre-DE-02 engine would silently ignore a mask
    # secret and emit UNKEYED output. DE-02 landed on engine main while the
    # engine's metadata still reported 0.3.0 (it sat in [Unreleased] without its
    # own bump); engine 0.4.0 is its first unambiguous version marker, so a
    # >=0.4.0 floor now *guarantees* keyprovider is present rather than merely
    # being necessary-but-not-sufficient. `decoy run` still runs a fail-closed
    # runtime probe (import decoy_engine.keyprovider) whenever a mask secret is
    # configured -- with the 0.4.0 floor this is defense-in-depth against a
    # broken or forced install (one that violates the resolver guarantee) rather
    # than the load-bearing guard it was under the 0.3.0 floor.
    # 0.5.0 is the first engine with the typed-carrier DP API (fit_dp_snapshot)
    # the DP fit path calls. 0.6.0 is the first with the `cloud` extra: the `cloud`/`ner`/`ml`/`vault` pass-through extras above resolve
    # against an engine old enough to lack `[cloud]` under the prior 0.5.0
    # floor, so `decoy-cli[cloud]` could silently install nothing extra.
    # 0.7.0 is the first engine that exports `read_fixed_width`
    # (which the CLI's source reader calls for `format: fixed_width`
    # sources) and `FixedWidthParseError` (which its parse failures raise).
    "decoy-engine>=0.7.0",
    # Pin the typer minor: `typer utils docs` metavar rendering differs across
    # typer minors (0.26.x emits `TEXT`/`FILE`; 0.27.x emits `<str>`/`<file>`),
    # and docs/cli-reference.md is committed and checked by the test_cli_surface
    # sentry. The old `>=0.9,<0.28` range still spanned both renderings, so a
    # fresh CI resolve (typer 0.27.2) regenerated a different format than the
    # committed 0.26.x reference and reddened the sentry. Cap to the 0.26 line so
    # CI reproduces the exact committed format; bumping the minor means
    # regenerating docs/cli-reference.md in the same PR.
    "typer>=0.26.7,<0.28",
    "rich>=13.0",
    "duckdb>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# CLI install DX (2026-09-25): pass-through extras so `pip install
# decoy-cli[...]` actually reaches the engine's matching extra instead of
# failing "unknown extra". The base install stays lean (no cloud SDKs, no
# NER/ML weight); each of these is opt-in by name. `all` bundles every
# user-facing extra; it deliberately excludes `dev` (contributor tooling,
# not a runtime capability).
#
# `vault` is a compatibility alias, not a real opt-in capability: the engine's own `vault` extra is `[]` because `cryptography` (FF1's
# AES-256 backend) is a base engine dependency, not optional. Kept so an
# existing `pip install decoy-cli[vault]` still resolves.
cloud = ["decoy-engine[cloud]"]
ner = ["decoy-engine[ner]"]
ml = ["decoy-engine[ml]"]
vault = ["decoy-engine[vault]"]
all = ["decoy-cli[cloud,ner,ml,vault]"]

# Phase 3.1 (docs/plans/2026-09-24-cli-native-packaging-default-on.md): no
# `native` extra here yet. `decoy-engine-native` has no PyPI release, so a
# bare `native = ["decoy-engine-native"]` would desync `uv.lock` the moment
# anyone resolves it, and a version-pinned entry alone would still let pip
# pair it with a different-ABI `decoy-engine` (the base dependency above is
# open-ended). The extra lands once a paired release exists, forwarding to
# the engine's own `decoy-engine[native]` extra so the ABI pin has one
# owner. No published direct-install artifact exists either yet (see
# `decoy explain native`). Until then: `decoy info` / `decoy preflight`
# for companion health, `decoy run --native` / `--no-native` for the
# runtime behavior -- all of which work today against a companion
# installed by other means (a local build, a hand-copied wheel),
# regardless of how it arrived.

# Project URLs surfaced on the PyPI sidebar. Source key is the
# convention pip/Warehouse uses.
[project.urls]
Homepage = "https://github.com/louiskeep/decoy"
Repository = "https://github.com/louiskeep/decoy"
Documentation = "https://github.com/louiskeep/decoy/blob/main/README.md"
Issues = "https://github.com/louiskeep/decoy/issues"
Changelog = "https://github.com/louiskeep/decoy/blob/main/CHANGELOG.md"
"Release smoke log" = "https://github.com/louiskeep/decoy/blob/main/docs/release/smoke-log.md"

[project.scripts]
# Console script name STAYS `decoy` regardless of the distribution
# name. Same with `forge` (the deprecation shim from S22).
decoy = "decoy.__main__:app"
forge = "decoy._deprecated:forge_shim"

[tool.hatch.build.targets.wheel]
# Import package stays `decoy` (Q-OSS-1 RESOLVED). The `packages` walk
# under src/decoy already pulls in `decoy/templates/`; a `force-include`
# entry was previously layered on top, which caused hatchling to add
# `decoy/templates/__init__.py` twice and `python -m build --wheel`
# to abort with "A second file is being added to the wheel archive".
# OSS.3 follow-up (2026-06-02): drop the force-include line. Confirmed
# via local build: dist/decoy_cli-0.1.0-py3-none-any.whl builds clean
# AND the templates still ship inside the wheel under decoy/templates/.
packages = ["src/decoy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ── Ruff lint + format baseline ─────────────────────────────────────────────
# Mirrors the engine's config (decoy-engine/pyproject.toml [tool.ruff]) but
# with a narrower select: the CLI is a thin Typer wrapper with no data-plane
# logic, so the heavy security (S) and naming (N) rulesets are excluded to
# keep the gate focused and violation-free from day one.
# B008 is suppressed globally because Typer's canonical idiom is to supply
# typer.Option/Argument as argument defaults; raising B008 on every command
# handler would require non-idiomatic workarounds.
# format --check is intentionally NOT in the CI gate (45 files would reformat
# on first run; land a separate formatting commit before enabling it).

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [".pytest_cache", "__pycache__", "logs", "docs/_build"]

[tool.ruff.lint]
# Focused selection: core pyflakes/pycodestyle (E/F), import order (I),
# bugbear (B), and Ruff-native rules (RUF, which catches ambiguous unicode
# including em-dashes per the no-em-dash repo rule).
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    "E501",   # line-too-long: owned by ruff format; not gated here yet
    "B008",   # typer.Option/Argument in defaults: idiomatic Typer pattern
    "B904",   # raise-without-from: cosmetic; high-volume; fix as touched
    "B905",   # zip-without-strict: noise in test assertions
    "RUF012", # mutable-class-default: false positives on dataclass-like defaults
    "RUF013", # implicit-Optional: cleanup as touched; high-volume
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert and have lower naming / style bars.
"tests/**" = ["S101", "S105", "S106", "S108", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
